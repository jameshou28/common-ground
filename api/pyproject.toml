[project]
name = "spaceapps-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rasterio>=1.4",
    "numpy>=2",
    "scipy>=1.13",
    "pyproj>=3.6",
    "httpx>=0.27",
    "boto3>=1.34",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
