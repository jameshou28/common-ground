name: Auto Deploy Trigger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  empty_commit:
    runs-on: ubuntu-latest
    if: github.actor != 'jameshou28'
    steps:
      - uses: actions/checkout@v4
      - name: Push to vercel
        run: |
          git config user.email "jameshou28@users.noreply.github.com"
          git config user.name "jameshou28"
          git commit --allow-empty -m "Push to vercel"
          git push
